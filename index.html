<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Guitar shop</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@200..700&family=Racing+Sans+One&display=swap" rel="stylesheet">
</head>

<body>
    <header class="hero">
        <img src="https://images.unsplash.com/photo-1692271931628-adc2b16670dd?q=80&w=1170&auto=format&fit=crop" alt="Guitar concert atmosphere">
        
        <div class="logo">
            <h1>GUITAR WORLD</h1>
        </div>
        
        <div class="header-right">
            <a href="index.html" class="nav-btn">MAIN</a>
            <a href="#" class="nav-btn">ABOUT US</a>
            <a href="#popular" class="nav-btn">PRODUCT LIST</a>
            <a href="#" class="nav-btn">CONTACTS</a>
            <a href="./checkout.html" class="cart-btn" id="cart-link">CART (0)</a>
        </div>
    </header>

    <main class="page-layout">
        <aside class="sidebar">
            <h2>Фільтри</h2>
            <ul class="filter-list">
                <li><label><input type="checkbox"> Електрогітари</label></li>
                <li><label><input type="checkbox"> Акустичні гітари</label></li>
                <li><label><input type="checkbox"> Бас-гітари</label></li>
                <li><label><input type="checkbox"> Аксесуари</label></li>
            </ul>
        </aside>

        <section class="products-content" id="popular">
            <h2 class="section-title-popular">POPULAR</h2>
            
            <div class="products-grid">
                <article class="product-card">
                    <img src="https://cdn.long-mcquade.com/files/399530/lg_379d76f66f556600b4122cbab3a441b7.png" alt="Gibson Les Paul" class="product-img">
                    <h3 class="product-name">Gibson Les Paul</h3>
                    <p class="product-price">2,500 $</p>
                    <button class="product-buy" id="btn-1" onclick="addToCart('Gibson Les Paul', 2500)">Buy</button>
                </article>

                <article class="product-card">
                    <img src="https://cdn.long-mcquade.com/files/124510/lg_1_1_0704233.jpg" alt="Jackson JS series" class="product-img">
                    <h3 class="product-name">Jackson JS series</h3>
                    <p class="product-price">300 $</p>
                    <button class="product-buy" id="btn-2" onclick="addToCart('Jackson JS series Dinky JS11', 300)">Buy</button>
                </article>

                <article class="product-card">
                    <img src="https://cdn.long-mcquade.com/files/77854/lg_1_1_491887.jpg" alt="Fender Stratocaster" class="product-img">
                    <h3 class="product-name">Fender Stratocaster</h3>
                    <p class="product-price">1,000 $</p>
                    <button class="product-buy" id="btn-3" onclick="addToCart('Fender Stratocaster Rosewood', 1000)">Buy</button>
                </article>
            </div>
        </section>
    </main>

    <footer> 
        GUITAR WORLD: (c) 2026. Made by Max
        <form>
            <input type="email" value="Your email">
            <input type="button" value="Submit">
        </form>
    </footer>

<script>
    
    document.addEventListener("DOMContentLoaded", function() {
        updateCartCount();
    });
    
    function addToCart(name, price) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        cart.push({ name: name, price: price });
        localStorage.setItem('cart', JSON.stringify(cart));
        alert(name + " додано в кошик!");
        updateCartCount();
    }

    function updateCartCount() {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let link = document.getElementById('cart-link');
        if (link) {
            link.innerText = "CART (" + cart.length + ")";
        }
    }
</script>
</body>
</html>
